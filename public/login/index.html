<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soccer Board - 登录</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: oklch(0.1 0 0); color: oklch(0.95 0 0);
    }
    .card {
      width: 100%; max-width: 380px; padding: 2rem;
      background: oklch(0.14 0 0); border: 1px solid oklch(0.25 0 0);
      border-radius: 1rem;
    }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; }
    p { font-size: 0.875rem; color: oklch(0.6 0 0); margin-bottom: 1.5rem; }
    label { display: block; font-size: 0.875rem; margin-bottom: 0.5rem; color: oklch(0.7 0 0); }
    input {
      width: 100%; padding: 0.6rem 0.75rem; font-size: 1rem;
      background: oklch(0.2 0 0); border: 1px solid oklch(0.3 0 0);
      border-radius: 0.5rem; color: oklch(0.95 0 0); outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: oklch(0.65 0.17 265); }
    button {
      width: 100%; margin-top: 1rem; padding: 0.6rem; font-size: 1rem; font-weight: 600;
      background: oklch(0.65 0.17 265); color: oklch(0.1 0 0);
      border: none; border-radius: 0.5rem; cursor: pointer; transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .error {
      margin-top: 0.75rem; padding: 0.5rem 0.75rem; font-size: 0.8rem;
      background: oklch(0.65 0.2 25 / 0.15); color: oklch(0.75 0.2 25);
      border-radius: 0.5rem; display: none;
    }
    .logo { font-size: 2rem; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">⚽</div>
    <h1>Soccer Board</h1>
    <p>请输入访问密码</p>
    <form id="form">
      <label for="password">密码</label>
      <input type="password" id="password" name="password" placeholder="输入密码" autofocus autocomplete="current-password" />
      <button type="submit" id="btn">登录</button>
      <div class="error" id="error">密码错误</div>
    </form>
  </div>
  <script>
    const form = document.getElementById("form");
    const btn = document.getElementById("btn");
    const error = document.getElementById("error");
    const params = new URLSearchParams(window.location.search);
    const returnTo = params.get("returnTo") || "/";

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const password = document.getElementById("password").value;
      if (!password) return;
      btn.disabled = true;
      btn.textContent = "验证中...";
      error.style.display = "none";
      try {
        const res = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password }),
        });
        if (res.ok) {
          window.location.href = returnTo;
        } else {
          error.style.display = "block";
          btn.disabled = false;
          btn.textContent = "登录";
        }
      } catch {
        error.textContent = "网络错误，请重试";
        error.style.display = "block";
        btn.disabled = false;
        btn.textContent = "登录";
      }
    });
  </script>
</body>
</html>
